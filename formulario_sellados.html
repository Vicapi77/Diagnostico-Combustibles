<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Sellados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --g900:#14532d; --g700:#15803d; --g600:#16a34a; --g100:#dcfce7; --g50:#f0fdf4;
    --red:#dc2626; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f7f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(135deg,var(--g900),var(--g600));color:#fff;padding:28px 16px 70px}
  header .wrap{max-width:760px;margin:auto}
  header h1{margin:0 0 6px;font-size:1.6rem}
  header p{margin:0;opacity:.85}
  main{max-width:760px;margin:-50px auto 40px;padding:0 16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:22px;margin-bottom:18px}
  .card h2{margin:0 0 16px;font-size:1.05rem;color:var(--g900);display:flex;align-items:center;gap:10px}
  .num{background:var(--g700);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-size:.85rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  label.f{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em}
  input[type=text],input[type=date],input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--g600);box-shadow:0 0 0 3px var(--g100)}
  input[readonly]{background:var(--g50);color:var(--g900);font-weight:600}
  .bad{border-color:var(--red)!important}
  .full{grid-column:1/-1}
  /* Autocompletar */
  .ac{position:relative}
  .ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto;z-index:20;display:none}
  .ac-item{padding:10px 12px;cursor:pointer;display:flex;gap:10px;font-size:.9rem;border-bottom:1px solid var(--line)}
  .ac-item:last-child{border-bottom:none}
  .ac-item b{color:var(--g700);min-width:72px}
  .ac-item.act,.ac-item:hover{background:var(--g50)}
  .ac-empty{padding:10px 12px;color:var(--muted);font-size:.88rem}
  .hint{font-size:.75rem;color:var(--muted);margin-top:6px}
  /* Si/No */
  .q{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none}
  .q .t{flex:1;font-size:.95rem}
  .q.sub .t{padding-left:18px;color:#374151}
  .q.sub .t::before{content:"↳ ";color:var(--muted)}
  .q.missing .t{color:var(--red)}
  .q.hidden{display:none}
  .yn{display:flex;gap:8px;flex-shrink:0}
  .yn input{display:none}
  .yn label{cursor:pointer;min-width:62px;text-align:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted);user-select:none;transition:.15s}
  .yn input[value=SI]:checked+label{background:var(--g600);border-color:var(--g600);color:#fff}
  .yn input[value=NO]:checked+label{background:var(--red);border-color:var(--red);color:#fff}
  button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:13px 22px;cursor:pointer}
  .btn{background:var(--g700);color:#fff;width:100%;font-size:1rem}
  .btn:disabled{opacity:.6;cursor:wait}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:13px 20px;border-radius:10px;color:#fff;font-weight:600;display:none;z-index:30;max-width:90%}
  .toast.ok{background:var(--g700)} .toast.err{background:var(--red)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Registro de Sellados</h1>
  <p>Captura el sellado de la unidad. Las respuestas se guardan en Google Sheets.</p>
</div></header>

<main>
  <div class="card">
    <h2><span class="num">1</span>Unidad y operador</h2>
    <div class="grid2">
      <div><label class="f">ID de unidad</label><input type="number" id="f_unidad" inputmode="numeric" placeholder="Ej. 1234"></div>
      <div><label class="f">Planta</label><input type="text" id="f_planta" placeholder="Planta"></div>
      <div class="ac">
        <label class="f">Nómina</label>
        <input type="text" id="f_nomina" inputmode="numeric" autocomplete="off" placeholder="Escribe la nómina o el nombre">
        <div class="ac-list" id="ac_list"></div>
        <div class="hint" id="nom_info">Cargando listado…</div>
      </div>
      <div><label class="f">Operador</label><input type="text" id="f_operador" readonly placeholder="Se llena automáticamente"></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>Revisión</h2>
    <div id="preguntas"></div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>Fechas</h2>
    <div class="grid2">
      <div><label class="f">Fecha de colocación</label><input type="date" id="f_fcol"></div>
      <div><label class="f">Fecha sellado gel coat</label><input type="date" id="f_fgel"></div>
    </div>
  </div>

  <button class="btn" id="send">Registrar</button>
</main>

<div class="toast" id="toast"></div>

let NOMINAS = NOMINAS_RESPALDO.map(([n, nombre]) => ({n: String(n), nombre}));
const info = document.getElementById("nom_info");

// --- Cargar nóminas desde el Sheet (pestaña NOMINAS) ---
async function cargarNominas(){
  try {
    const r = await fetch(WEB_APP_URL + "?accion=nominas");
    const d = await r.json();
    if (Array.isArray(d.nominas) && d.nominas.length) {
      NOMINAS = d.nominas.map(([n, nombre]) => ({n: String(n).trim(), nombre: String(nombre||"").trim()}));
      info.textContent = `${NOMINAS.length} operadores cargados desde el Sheet`;
      return;
    }
    throw 0;
  } catch(e) {
    info.textContent = `${NOMINAS.length} operadores (listado guardado en el formulario)`;
  }
}
cargarNominas();

// --- Autocompletar nómina ---
const inp = document.getElementById("f_nomina"), list = document.getElementById("ac_list"), op = document.getElementById("f_operador");
let activo = -1, resultados = [];
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();

function buscar(){
  const q = norm(inp.value.trim());
  const exacto = NOMINAS.find(x => x.n === inp.value.trim());
  op.value = exacto ? exacto.nombre : "";
  if (!q) { list.style.display = "none"; return; }
  resultados = NOMINAS.filter(x => x.n.startsWith(q) || norm(x.nombre).includes(q)).slice(0, 12);
  activo = -1;
  list.innerHTML = resultados.length
    ? resultados.map((x,i) => `<div class="ac-item" data-i="${i}"><b>${x.n}</b><span>${x.nombre}</span></div>`).join("")
    : `<div class="ac-empty">Sin coincidencias</div>`;
  list.style.display = (exacto && resultados.length === 1) ? "none" : "block";
}
function elegir(i){
  const x = resultados[i]; if (!x) return;
  inp.value = x.n; op.value = x.nombre; list.style.display = "none";
  inp.classList.remove("bad");
}
inp.addEventListener("input", buscar);
inp.addEventListener("focus", () => inp.value && buscar());
inp.addEventListener("keydown", e => {
  const items = list.querySelectorAll(".ac-item");
  if (e.key === "ArrowDown") { activo = Math.min(activo+1, items.length-1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { activo = Math.max(activo-1, 0); e.preventDefault(); }
  else if (e.key === "Enter") { e.preventDefault(); elegir(activo >= 0 ? activo : 0); return; }
  else if (e.key === "Escape") { list.style.display = "none"; return; }
  items.forEach((el,i) => el.classList.toggle("act", i === activo));
  items[activo]?.scrollIntoView({block:"nearest"});
});
list.addEventListener("mousedown", e => { const it = e.target.closest(".ac-item"); if (it) { e.preventDefault(); elegir(+it.dataset.i); } });
inp.addEventListener("blur", () => setTimeout(() => list.style.display = "none", 150));

  {k:"porta",    t:"Porta candado o escuadra para colocar fleje"},

PREGUNTAS.forEach(p => cont.insertAdjacentHTML("beforeend", `
  <div class="q ${p.sub ? "sub" : ""}" id="w_${p.k}">
    <div class="t">${p.t}</div>
    <div class="yn">
      <input type="radio" name="${p.k}" id="${p.k}_si" value="SI"><label for="${p.k}_si">SÍ</label>
      <input type="radio" name="${p.k}" id="${p.k}_no" value="NO"><label for="${p.k}_no">NO</label>
    </div>
  </div>`));
const val = k => (document.querySelector(`input[name="${k}"]:checked`)||{}).value || "";
const visible = p => !(p.sub && val("ac") === "NO");

function refrescar(){
  PREGUNTAS.forEach(p => {
    const w = document.getElementById("w_"+p.k);
    w.classList.toggle("hidden", !visible(p));
    if (val(p.k)) w.classList.remove("missing");
  });
}
cont.addEventListener("change", refrescar);
document.querySelectorAll("input").forEach(i => i.addEventListener("input", () => i.classList.remove("bad")));

function toast(msg, tipo){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast " + tipo; t.style.display = "block";
  setTimeout(()=> t.style.display = "none", 3500);
}
const fmt = d => d ? d.split("-").reverse().join("/") : "";

document.getElementById("send").addEventListener("click", async () => {
  let primero = null;
  const marcar = el => { el.classList.add("bad"); primero = primero || el; };
  [f_unidad, f_planta, f_fcol, f_fgel].forEach(el => { if (!el.value.trim()) marcar(el); });
  if (!op.value) marcar(inp);
  PREGUNTAS.filter(visible).forEach(p => { if (!val(p.k)) { const w = document.getElementById("w_"+p.k); w.classList.add("missing"); primero = primero || w; } });
  if (primero) {
    primero.scrollIntoView({behavior:"smooth", block:"center"});
    toast(!op.value && inp.value ? "La nómina no está en el listado" : "Completa los campos marcados en rojo", "err");
    return;
  }

  const datos = {
    "Fecha registro": new Date().toLocaleString("es-MX"),
    "ID de unidad": f_unidad.value.trim(),
    "Planta": f_planta.value.trim(),
    "Nómina": inp.value.trim(),
    "Operador": op.value
  };
  PREGUNTAS.forEach(p => datos[p.t] = visible(p) ? val(p.k) : "N/A");
  datos["Fecha de colocación"] = fmt(f_fcol.value);
  datos["Fecha sellado gel coat"] = fmt(f_fgel.value);

  const btn = document.getElementById("send");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    await fetch(WEB_APP_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({headers: Object.keys(datos), values: Object.values(datos)})
    });
    toast("✓ Sellado registrado", "ok");
    document.querySelectorAll("input[type=text],input[type=number],input[type=date]").forEach(i => i.value = "");
    document.querySelectorAll("input[type=radio]").forEach(i => i.checked = false);
    refrescar(); window.scrollTo({top:0,behavior:"smooth"});
  } catch(e) {
    toast("Error al enviar. Revisa tu conexión.", "err");
  } finally {
    btn.disabled = false; btn.textContent = "Registrar";
  }
});
</script>
</body>
</html>
